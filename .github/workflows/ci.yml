name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Run the Swift tests
        run: swift test
      - name: Build the app
        run: ./Scripts/build_app.sh
      - name: Run the command tests
        run: |
          python3 -B -m unittest discover -s Tests/CodexWhoTests
          python3 -B -m unittest discover -s Tests/ClaudeWhoTests
